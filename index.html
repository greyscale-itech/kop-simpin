<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koperasi Kosfa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E6FD9'/%3E%3Cpath d='M20 14V50M20 34L40 16M27 29L42 50' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{--or:#1E6FD9;--or2:#1FB58A;--bg:#F5F5F5;--card:#fff;--tx:#222;--mu:#757575;--ln:#EAEAEA;--ok:#1B9A7A;--no:#D0011B;--wn:#C77700;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1E1E1E;--tx:#F2F2F2;--mu:#A0A0A0;--ln:#2E2E2E;--ok:#3CCBA5;--no:#FF6B6B;--wn:#FFB84D}}
:root[data-theme="dark"]{--bg:#121212;--card:#1E1E1E;--tx:#F2F2F2;--mu:#A0A0A0;--ln:#2E2E2E;--ok:#3CCBA5;--no:#FF6B6B;--wn:#FFB84D}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;font-size:14px;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;padding-bottom:76px}
.hd{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;padding:18px 16px 64px}
.hd h1{font-size:17px;font-weight:700}.hd p{font-size:12px;opacity:.9;margin-top:2px}
.wal{margin:-48px 12px 0;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:14px}
.wal small{color:var(--mu);font-size:12px}.wal b.big{font-size:24px;display:block;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.st{background:none;border:0;color:var(--tx);cursor:pointer;text-align:center;font-size:11.5px;padding:4px 0}
.st b{display:block;font-size:20px;margin-bottom:2px}
.sec{margin:12px;background:var(--card);border-radius:10px;padding:14px}
.sec h2{font-size:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}.row>span{color:var(--mu)}.row small{display:block;color:var(--mu);font-size:11.5px;margin-top:2px}
button.row{width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);text-align:left;font:inherit;cursor:pointer}
.in{color:var(--ok);font-weight:600}.out{color:var(--no);font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.Lancar{background:#E3F6F0;color:#127A5F}.Telat{background:#FDE8E8;color:#B3001A}.Lunas{background:#E6EEFB;color:#1456AE}.Segera{background:#FFF1D6;color:#8A5200}
@media (prefers-color-scheme:dark){.Lancar{background:#173B31;color:#3CCBA5}.Telat{background:#43191D;color:#FF8A8A}.Lunas{background:#17283D;color:#7DB2F5}.Segera{background:#3D2E10;color:#FFB84D}}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.who{display:flex;gap:10px;align-items:center;min-width:0}.who div{min-width:0}
.rt{text-align:right;flex:none}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bp{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.bp i{width:44%;border-radius:3px 3px 0 0;display:block}
.bp i.m{background:linear-gradient(180deg,var(--or2),var(--or))}.bp i.k{background:#B8C4D6}
@media (prefers-color-scheme:dark){.bp i.k{background:#5B6778}}
.bc small{font-size:11px;color:var(--mu)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.srch{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:11px 12px;font-size:16px}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:none;color:var(--tx);border-radius:16px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chips button.on{background:var(--or);border-color:var(--or);color:#fff}
.prog{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}.prog div{height:100%;background:linear-gradient(90deg,var(--or),var(--or2))}
nav{position:fixed;bottom:0;width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--or);font-weight:600}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:430px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.sh h3{font-size:16px}.sh>p{color:var(--mu);font-size:12.5px;margin:2px 0 8px}
.btn{width:100%;border:0;border-radius:6px;background:var(--or);color:#fff;font-weight:600;font-size:14px;padding:12px;cursor:pointer;margin-top:12px}
.nt{color:var(--mu);font-size:11.5px;text-align:center;margin:4px 12px 12px}
.fl{display:block;font-size:12px;color:var(--mu);margin-top:10px}.fm{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:12px;font-size:16px;margin-top:4px;font-family:inherit}.err{color:var(--no);font-size:12.5px;margin-top:8px;min-height:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn.g{background:none;border:1px solid var(--or);color:var(--or)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90%;text-align:center}
.lgn{min-height:100vh;background:linear-gradient(160deg,var(--or),var(--or2));display:flex;flex-direction:column;justify-content:center;padding:24px 16px;margin-bottom:-76px}
.lgh{text-align:center;color:#fff;margin-bottom:22px}.lgh svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}.lgh h1{font-size:22px;margin-top:12px}.lgh p{font-size:13px;opacity:.92;margin-top:4px}
.lc{background:var(--card);border-radius:14px;padding:18px 16px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.lk{background:none;border:0;color:var(--mu);font-size:12.5px;margin-top:14px;width:100%;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<script>
var BULAN=["Mei","Jun","Jul","Agu","Sep","Okt"];
var MASUK=[0,0,0,0,0,0];
var KELUAR=[0,0,0,0,0,0];
var D=[];
var TX=[];
var S={tab:"home",f:"Semua",q:""};
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function jt(n){return (n/1000000).toLocaleString("id-ID",{maximumFractionDigits:1})+" jt"}
function cnt(s){return D.filter(function(d){return d.st===s}).length}
function go(t,f){S.tab=t;if(f)S.f=f;draw()}
function ini(n){return n.split(" ").map(function(w){return w[0]}).slice(0,2).join("")}

function item(d,i){return '<button class="row" onclick="det('+i+')"><div class="who"><span class="av">'+ini(d.n)+'</span><div><b>'+d.n+'</b><small>'+d.u+' · '+rp(d.pk)+'</small></div></div><div class="rt"><span class="tag '+d.st+'">'+d.st+'</span><small style="display:block;color:var(--mu);font-size:11.5px;margin-top:4px">Sisa '+rp(d.sisa)+'</small></div></button>'}

function home(){
var aktif=D.filter(function(d){return d.st!=="Lunas"}),beredar=aktif.reduce(function(a,d){return a+d.sisa},0),tung=D.reduce(function(a,d){return a+d.tg},0);
var mx=Math.max.apply(null,MASUK.concat(KELUAR))||1;
var bars=BULAN.map(function(b,i){return '<div class="bc"><div class="bp"><i class="m" style="height:'+(MASUK[i]/mx*100)+'%"></i><i class="k" style="height:'+(KELUAR[i]/mx*100)+'%"></i></div><small>'+b+'</small></div>'}).join("");
var tl=D.map(function(d,i){return d.st==="Telat"?item(d,i):""}).join("");
return '<div class="hd"><h1>Koperasi Kosfa</h1><p>Pantau peminjam dan arus kas pinjaman</p></div>'+
'<div class="wal"><small>Total piutang beredar</small><b class="big">'+rp(beredar)+'</b><small style="display:block;margin-top:4px">Tunggakan '+rp(tung)+'</small>'+
'<div class="grid"><button class="st" onclick="go(\'deb\',\'Semua\')"><b>'+D.length+'</b>Semua</button><button class="st" onclick="go(\'deb\',\'Lancar\')"><b style="color:var(--ok)">'+cnt("Lancar")+'</b>Lancar</button><button class="st" onclick="go(\'deb\',\'Telat\')"><b style="color:var(--no)">'+cnt("Telat")+'</b>Telat</button><button class="st" onclick="go(\'deb\',\'Lunas\')"><b style="color:var(--or)">'+cnt("Lunas")+'</b>Lunas</button></div></div>'+
'<div class="sec"><h2>Cash flow 6 bulan terakhir</h2><div class="bars">'+bars+'</div><div class="lg"><span><i style="background:var(--or)"></i>Kas masuk</span><span><i style="background:#B8C4D6"></i>Kas keluar</span></div></div>'+
'<div class="sec"><h2>Perlu ditagih</h2>'+(tl||'<p style="color:var(--mu)">'+(D.length?'Semua debitur lancar.':'Belum ada debitur.')+'</p>')+'</div>'}

function debitur(){
var ch=["Semua","Lancar","Telat","Lunas"].map(function(c){return '<button class="'+(S.f===c?"on":"")+'" onclick="S.f=\''+c+'\';draw()">'+c+'</button>'}).join("");
return '<div class="hd"><h1>Daftar debitur</h1><p>Siapa saja yang meminjam</p></div><div class="wal"><input class="srch" id="q" placeholder="Cari nama atau usaha" value="'+S.q+'" oninput="S.q=this.value;lst()"><div class="chips">'+ch+'</div><div id="lst"></div></div>'}
function lst(){
var q=S.q.toLowerCase(),h=D.map(function(d,i){return (S.f==="Semua"||d.st===S.f)&&(d.n+" "+d.u).toLowerCase().indexOf(q)>-1?item(d,i):""}).join("");
document.getElementById("lst").innerHTML=h||'<p style="color:var(--mu);padding:12px 0">'+(D.length?'Nggak ada debitur yang cocok.':'Belum ada debitur. Tambahkan lewat tab Admin.')+'</p>'}

function cash(){
var n=BULAN.length-1,net=MASUK[n]-KELUAR[n];
var rows=BULAN.map(function(b,i){var x=MASUK[i]-KELUAR[i];return '<div class="row"><div><b>'+b+' 2026</b><small>Masuk '+jt(MASUK[i])+' · Keluar '+jt(KELUAR[i])+'</small></div><div class="'+(x>=0?"in":"out")+'">'+(x>=0?"+":"−")+rp(Math.abs(x))+'</div></div>'}).reverse().join("");
var tx=TX.map(function(t){return '<div class="row"><div><b>'+esc(t[1])+'</b><small>'+esc(t[0])+' · '+t[3]+'</small></div><div class="'+(t[2]>0?"in":"out")+'">'+(t[2]>0?"+":"−")+rp(Math.abs(t[2]))+'</div></div>'}).join("");
return '<div class="hd"><h1>Cash flow</h1><p>Angsuran masuk dan pencairan keluar</p></div><div class="wal"><small>Kas bersih Oktober 2026</small><b class="big '+(net>=0?"in":"out")+'">'+(net>=0?"+":"−")+rp(Math.abs(net))+'</b>'+
'<div class="grid" style="grid-template-columns:1fr 1fr"><div class="st"><b class="in" style="font-size:16px">'+rp(MASUK[n])+'</b>Kas masuk</div><div class="st"><b style="font-size:16px">'+rp(KELUAR[n])+'</b>Kas keluar</div></div><button class="btn" onclick="danaMasuk()">+ Tambah dana masuk</button></div>'+
'<div class="sec"><h2>Per bulan</h2>'+rows+'</div><div class="sec"><h2>Transaksi terakhir</h2>'+(tx||'<p style="color:var(--mu)">Belum ada transaksi.</p>')+'</div>'}

function det(i){
var d=D[i],p=100*d.b/d.t;
var h='<div class="mk" onclick="if(event.target===this)this.remove()"><div class="sh"><div class="who"><span class="av">'+ini(d.n)+'</span><div><h3>'+d.n+'</h3></div><span class="tag '+d.st+'" style="margin-left:auto">'+d.st+'</span></div><p>'+d.u+'</p>'+
'<div class="prog"><div style="width:'+p+'%"></div></div><small style="color:var(--mu)">'+d.b+' dari '+d.t+' cicilan terbayar</small>'+
[["Pokok pinjaman",rp(d.pk)],["Tanggal cair",d.cair],["Tenor",d.t+" bulan"],["Cicilan per bulan",rp(d.c)],["Sisa tagihan",rp(d.sisa)],["Terlambat",d.tl>0?d.tl+" hari ("+rp(d.tg)+")":"Tidak ada"]].map(function(r){return '<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join("")+
'<button class="btn" onclick="this.closest(\'.mk\').remove()">Tutup</button></div></div>';
document.body.insertAdjacentHTML("beforeend",h)}

var K=[];
function kitem(k,i){return '<button class="row" onclick="kdet('+i+')"><div class="who"><span class="av">'+ini(k.n)+'</span><div><b>'+k.n+'</b><small>'+k.j+' · '+(k.st==='Lunas'?'Sudah lunas':'Jatuh tempo '+k.jt)+'</small></div></div><div class="rt"><span class="tag '+k.st+'">'+k.st+'</span><small style="display:block;color:var(--mu);font-size:11.5px;margin-top:4px">Sisa '+rp(k.sisa)+'</small></div></button>'}
function kreditur(){
var ak=K.filter(function(k){return k.st!=='Lunas'}),tot=ak.reduce(function(a,k){return a+k.sisa},0),ang=ak.reduce(function(a,k){return a+k.a},0),pit=D.reduce(function(a,d){return a+(d.st==='Lunas'?0:d.sisa)},0),cov=ang?MASUK[MASUK.length-1]/ang:0,mx=Math.max(pit,tot)||1;
function bar(l,v,c){return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--mu)">'+l+'</span><b>'+rp(v)+'</b></div><div class="prog"><div style="width:'+(v/mx*100)+'%;background:'+c+'"></div></div></div>'}
return '<div class="hd"><h1>Admin</h1><p>Kelola debitur dan pantau kreditur</p></div><div class="wal"><small>Total kewajiban ke kreditur</small><b class="big">'+rp(tot)+'</b><small style="display:block;margin-top:4px">Angsuran '+rp(ang)+' per bulan</small><div class="grid"><div class="st"><b>'+ak.length+'</b>Aktif</div><div class="st"><b>'+jt(ang)+'</b>Angsuran/bln</div><div class="st"><b style="color:var(--ok)">'+(ang?cov.toLocaleString('id-ID',{maximumFractionDigits:1})+'×':'-')+'</b>Cakupan</div><div class="st"><b style="color:var(--or)">'+(K.length-ak.length)+'</b>Lunas</div></div></div>'+
'<div class="sec"><h2>Kelola debitur</h2><p style="color:var(--mu);font-size:12.5px">Debitur baru otomatis muncul di tab Debitur, Home, dan Cash flow.</p><button class="btn" onclick="tambah()">+ Tambah debitur</button></div>'+
'<div class="sec"><h2>Piutang debitur vs kewajiban</h2>'+bar('Piutang beredar (debitur)',pit,'var(--or2)')+bar('Kewajiban (kreditur)',tot,'#B8C4D6')+'<small style="color:var(--mu)">Cakupan = kas masuk bulan ini dibagi angsuran ke kreditur.</small></div>'+
'<div class="sec"><h2>Daftar kreditur</h2>'+(K.map(kitem).join('')||'<p style="color:var(--mu)">Belum ada data kreditur.</p>')+'</div>'+akunSec()+'<p class="nt" style="margin:16px 12px 8px">Developed by Fajar Q.</p>'}
function kdet(i){var k=K[i],p=100*(k.pl-k.sisa)/k.pl;
var h='<div class="mk" onclick="if(event.target===this)this.remove()"><div class="sh"><div class="who"><span class="av">'+ini(k.n)+'</span><div><h3>'+k.n+'</h3></div><span class="tag '+k.st+'" style="margin-left:auto">'+k.st+'</span></div><p>'+k.j+'</p><div class="prog"><div style="width:'+p+'%"></div></div><small style="color:var(--mu)">'+Math.round(p)+'% pokok sudah dilunasi</small>'+[['Plafon pinjaman',rp(k.pl)],['Sisa kewajiban',rp(k.sisa)],['Angsuran per bulan',k.a?rp(k.a):'-'],['Bunga / bagi hasil',k.bg+'% per tahun'],['Jatuh tempo berikutnya',k.jt]].map(function(r){return '<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join('')+'<button class="btn" onclick="this.parentNode.parentNode.remove()">Tutup</button></div></div>';
document.body.insertAdjacentHTML('beforeend',h)}
function mkD(x){var c=Math.round(x[2]*(1+0.01*x[3])/x[3]);var st=x[4]>=x[3]?'Lunas':x[6]>0?'Telat':'Lancar';return {n:x[0],u:x[1],pk:x[2],t:x[3],b:x[4],cair:x[5],tl:x[6],c:c,st:st,sisa:(x[3]-x[4])*c,tg:x[6]>0?Math.ceil(x[6]/30)*c:0}}
var KEYB='kosfa-baru-v2',BARU=[];
function addD(x,save){D.push(mkD(x));var p=x[7].split('-'),m=+p[1]-5;if(+p[0]===2026&&m>=0&&m<=5)KELUAR[m]+=x[2];TX.unshift(['Pencairan',x[0],-x[2],x[5]]);if(save){BARU.push(x);try{localStorage.setItem(KEYB,JSON.stringify(BARU))}catch(e){}}}
try{var rb=localStorage.getItem(KEYB);if(rb){var lb=JSON.parse(rb);lb.forEach(function(x){addD(x,false)});BARU=lb}}catch(e){}
function tambah(){
var iso=new Date().toISOString().slice(0,10);
var h='<div class="mk" onclick="if(event.target===this)this.remove()"><div class="sh"><h3>Tambah debitur</h3><p>Pinjaman baru langsung masuk ke daftar debitur dan cash flow.</p>'+
'<label class="fl" for="fn">Nama debitur</label><input class="fm" id="fn" placeholder="Contoh: Budi Santoso">'+
'<label class="fl" for="fu">Jenis usaha</label><input class="fm" id="fu" placeholder="Contoh: Warung sembako">'+
'<label class="fl" for="fp">Pokok pinjaman (Rp)</label><input class="fm" id="fp" type="number" inputmode="numeric" placeholder="5000000">'+
'<label class="fl" for="ft">Tenor</label><select class="fm" id="ft"><option value="3">3 bulan</option><option value="6" selected>6 bulan</option><option value="10">10 bulan</option><option value="12">12 bulan</option></select>'+
'<label class="fl" for="fd">Tanggal cair</label><input class="fm" id="fd" type="date" value="'+iso+'">'+
'<div class="err" id="err"></div><button class="btn" onclick="simpanD()">Simpan debitur</button></div></div>';
document.body.insertAdjacentHTML('beforeend',h);document.getElementById('fn').focus()}
function simpanD(){
var n=document.getElementById('fn').value.trim(),u=document.getElementById('fu').value.trim(),pk=parseInt(document.getElementById('fp').value,10),t=parseInt(document.getElementById('ft').value,10),dv=document.getElementById('fd').value,e=document.getElementById('err');
if(!n)return e.textContent='Nama debitur wajib diisi.';
if(!u)return e.textContent='Jenis usaha wajib diisi.';
if(!(pk>=100000))return e.textContent='Minimal pinjaman Rp100.000.';
if(!dv)return e.textContent='Tanggal cair wajib diisi.';
if(D.some(function(d){return d.n.toLowerCase()===n.toLowerCase()&&d.st!=='Lunas'}))return e.textContent='Debitur ini masih punya pinjaman aktif.';
var p=dv.split('-'),cair=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
addD([n,u,pk,t,0,cair,0,dv],true);
document.querySelector('.mk').remove();S.f='Semua';S.q=n;S.tab='deb';draw()}
var AK='kosfa-auth',A=null,AUTH=false;
try{A=JSON.parse(localStorage.getItem(AK))}catch(e){}
try{AUTH=!!A&&sessionStorage.getItem('kosfa-sess')==='1'}catch(e){}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function val(i){return document.getElementById(i).value}
function emsg(m){var e=document.getElementById('err');if(e)e.textContent=m}
function toast(m){var e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},3500)}
function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)})}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
function saveA(){try{localStorage.setItem(AK,JSON.stringify(A))}catch(e){}}
function setSess(){AUTH=true;try{sessionStorage.setItem('kosfa-sess','1')}catch(e){}S.tab='home';draw()}
function logo(z){return '<svg width="'+z+'" height="'+z+'" viewBox="0 0 64 64" role="img" aria-label="Logo Koperasi Kosfa"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E6FD9"/><stop offset="1" stop-color="#1FB58A"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#fff"/><path d="M20 14V50M20 34L40 16M27 29L42 50" stroke="url(#lgg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="48" cy="17" r="5" fill="url(#lgg)"/></svg>'}
function loginView(){
var a=!!A,bio=a&&A.cred&&window.PublicKeyCredential;
document.getElementById('app').innerHTML='<div class="lgn"><div class="lgh">'+logo(76)+'<h1>Koperasi Kosfa</h1><p>'+(a?'Masuk untuk mengelola pinjaman':'Buat akun admin pertama untuk mulai')+'</p></div><div class="lc"><form novalidate onsubmit="event.preventDefault();'+(a?'masuk()':'daftar()')+'">'+
'<label class="fl" for="le" style="margin-top:0">Email</label><input class="fm" id="le" type="email" autocomplete="email" placeholder="nama@email.com"'+(a?' value="'+esc(A.email)+'"':'')+'>'+
'<label class="fl" for="lp">Kata sandi</label><input class="fm" id="lp" type="password" autocomplete="'+(a?'current-password':'new-password')+'" placeholder="Minimal 8 karakter">'+
(a?'':'<label class="fl" for="lq">Ulangi kata sandi</label><input class="fm" id="lq" type="password" autocomplete="new-password">')+
'<div class="err" id="err"></div><button class="btn" type="submit">'+(a?'Masuk':'Buat akun dan masuk')+'</button></form>'+
(bio?'<button class="btn g" type="button" onclick="bioLogin()">Masuk dengan biometrik</button>':'')+
(a?'<button class="lk" type="button" onclick="resetAkun()">Lupa kata sandi? Reset akun di perangkat ini</button>':'')+'</div></div>'}
async function daftar(){
var em=val('le').trim().toLowerCase(),p=val('lp'),q=val('lq');
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return emsg('Format email belum benar.');
if(p.length<8)return emsg('Kata sandi minimal 8 karakter.');
if(p!==q)return emsg('Ulangi kata sandi belum sama.');
try{var sl=b64(rnd(16));A={email:em,salt:sl,hash:await sha(sl+p),cred:null};saveA();setSess()}catch(e){emsg('Browser ini belum mendukung penyimpanan kata sandi yang aman.')}}
async function masuk(){
var em=val('le').trim().toLowerCase(),p=val('lp');
try{if(em===A.email&&await sha(A.salt+p)===A.hash)return setSess()}catch(e){}
emsg('Email atau kata sandi salah.')}
async function bioReg(){
if(!window.PublicKeyCredential||!navigator.credentials)return toast('Perangkat ini belum mendukung biometrik.');
try{var c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Koperasi Kosfa'},user:{id:rnd(16),name:A.email,displayName:A.email},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
A.cred=b64(c.rawId);saveA();toast('Biometrik aktif');draw()}catch(e){toast('Biometrik belum bisa diaktifkan. Buka link langsung di browser HP, bukan di dalam preview.')}}
async function bioLogin(){
try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(A.cred)}],userVerification:'required',timeout:60000}});setSess()}catch(e){emsg('Verifikasi biometrik gagal atau dibatalkan.')}}
function logout(){AUTH=false;try{sessionStorage.removeItem('kosfa-sess')}catch(e){}draw()}
function resetAkun(){if(confirm('Hapus akun admin di perangkat ini? Setelahnya kamu bisa buat akun baru.')){try{localStorage.removeItem(AK)}catch(e){}A=null;draw()}}
var KEYM='kosfa-masuk-v2',MSK=[];
function mIdx(iso){var p=iso.split('-'),m=+p[1]-5;return +p[0]===2026&&m>=0&&m<=5?m:-1}
function addM(x,save){var i=mIdx(x[3]);if(i>=0)MASUK[i]+=x[2];TX.unshift([x[0],x[1],x[2],x[4]]);if(save){MSK.push(x);try{localStorage.setItem(KEYM,JSON.stringify(MSK))}catch(e){}}}
try{var rm=localStorage.getItem(KEYM);if(rm){var lm=JSON.parse(rm);lm.forEach(function(x){addM(x,false)});MSK=lm}}catch(e){}
function danaMasuk(){
var iso=new Date().toISOString().slice(0,10);
document.body.insertAdjacentHTML('beforeend','<div class="mk" onclick="if(event.target===this)this.remove()"><div class="sh"><h3>Tambah dana masuk</h3><p>Dicatat sebagai kas masuk dan langsung masuk ke cash flow.</p>'+
'<label class="fl" for="ms">Sumber dana</label><select class="fm" id="ms"><option>Angsuran debitur</option><option>Setoran modal</option><option>Pendapatan lain</option><option>Lainnya</option></select>'+
'<label class="fl" for="mt">Keterangan (opsional)</label><input class="fm" id="mt" maxlength="60" placeholder="Contoh: Angsuran Siti Aminah">'+
'<label class="fl" for="mn">Nominal (Rp)</label><input class="fm" id="mn" type="number" inputmode="numeric" placeholder="500000">'+
'<label class="fl" for="md">Tanggal</label><input class="fm" id="md" type="date" value="'+iso+'">'+
'<div class="err" id="err"></div><button class="btn" onclick="simpanM()">Simpan dana masuk</button></div></div>');document.getElementById('mn').focus()}
function simpanM(){
var sm=val('ms'),kt=val('mt').trim(),n=parseInt(val('mn'),10),dv=val('md'),e=document.getElementById('err');
if(!(n>=1000))return e.textContent='Minimal dana masuk Rp1.000.';
if(!dv)return e.textContent='Tanggal wajib diisi.';
if(mIdx(dv)<0)return e.textContent='Tanggal harus di antara Mei dan Oktober 2026.';
var p=dv.split('-'),tg=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
addM([sm,kt||sm,n,dv,tg],true);
document.querySelector('.mk').remove();draw();toast('Dana masuk tercatat')}
function akunSec(){return '<div class="sec"><h2>Akun admin</h2><div class="row"><span>Email</span><b>'+esc(A.email)+'</b></div><div class="row"><span>Biometrik</span><b>'+(A.cred?'Aktif':'Belum aktif')+'</b></div>'+(A.cred?'':'<button class="btn g" onclick="bioReg()">Aktifkan biometrik</button>')+'<button class="btn g" onclick="logout()">Keluar</button></div>'}
function draw(){
if(!AUTH)return loginView();
var v={home:home,deb:debitur,cash:cash,kre:kreditur}[S.tab]();
var n=[["home","🏠","Home"],["deb","👥","Debitur"],["cash","📊","Cash flow"],["kre","⚙️","Admin"]];
document.getElementById("app").innerHTML=v+'<nav>'+n.map(function(x){return '<button class="'+(S.tab===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join("")+'</nav>';
if(S.tab==="deb")lst()}
draw();
</script>
</body>
</html>
