<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koperasi Kosfa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E6FD9'/%3E%3Cpath d='M20 14V50M20 34L40 16M27 29L42 50' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{--or:#1E6FD9;--or2:#1FB58A;--bg:#F5F5F5;--card:#fff;--tx:#222;--mu:#757575;--ln:#EAEAEA;--ok:#1B9A7A;--no:#D0011B;--wn:#C77700;--kb:#B8C4D6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1E1E1E;--tx:#F2F2F2;--mu:#A0A0A0;--ln:#2E2E2E;--ok:#3CCBA5;--no:#FF6B6B;--wn:#FFB84D;--kb:#5B6778}}
:root[data-theme="dark"]{--bg:#121212;--card:#1E1E1E;--tx:#F2F2F2;--mu:#A0A0A0;--ln:#2E2E2E;--ok:#3CCBA5;--no:#FF6B6B;--wn:#FFB84D;--kb:#5B6778}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;font-size:14px;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;padding-bottom:76px}
.hd{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;padding:18px 16px 64px}
.hd h1{font-size:17px;font-weight:700}.hd p{font-size:12px;opacity:.9;margin-top:2px}
.wal{margin:-48px 12px 0;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:14px}
.wal small{color:var(--mu);font-size:12px}.wal b.big{font-size:24px;display:block;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.st{background:none;border:0;color:var(--tx);cursor:pointer;text-align:center;font-size:11.5px;padding:4px 0}
.st b{display:block;font-size:20px;margin-bottom:2px}
.sec{margin:12px;background:var(--card);border-radius:10px;padding:14px}
.sec h2{font-size:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}.row>span{color:var(--mu)}.row small{display:block;color:var(--mu);font-size:11.5px;margin-top:2px}
button.row{width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);text-align:left;font:inherit;cursor:pointer}
.in{color:var(--ok);font-weight:600}.out{color:var(--no);font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.Lancar{background:#E3F6F0;color:#127A5F}.Telat{background:#FDE8E8;color:#B3001A}.Lunas{background:#E6EEFB;color:#1456AE}
@media (prefers-color-scheme:dark){.Lancar{background:#173B31;color:#3CCBA5}.Telat{background:#43191D;color:#FF8A8A}.Lunas{background:#17283D;color:#7DB2F5}}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.who{display:flex;gap:10px;align-items:center;min-width:0}.who div{min-width:0}
.rt{text-align:right;flex:none}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bp{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.bp i{width:44%;border-radius:3px 3px 0 0;display:block}
.bp i.m{background:linear-gradient(180deg,var(--or2),var(--or))}.bp i.k{background:var(--kb)}
.bc small{font-size:11px;color:var(--mu)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw{position:relative}.si{position:absolute;left:12px;top:11px;font-size:16px;pointer-events:none}
.srch{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:11px 12px 11px 38px;font-size:16px}
#sg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--card);border:1px solid var(--ln);border-radius:6px;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden}
#sg button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:inherit;cursor:pointer}
#sg button:last-child{border-bottom:0}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:none;color:var(--tx);border-radius:16px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chips button.on{background:var(--or);border-color:var(--or);color:#fff}
.prog{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}.prog div{height:100%;background:linear-gradient(90deg,var(--or),var(--or2))}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--or);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.72;padding:8px 0 7px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{display:flex;align-items:center;justify-content:center;width:44px;height:26px;border-radius:13px}nav button i svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{opacity:1;font-weight:600}nav button.on i{background:rgba(255,255,255,.22)}nav button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:430px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto}
.sh h3{font-size:16px}.sh>p{color:var(--mu);font-size:12.5px;margin:2px 0 8px}
.btn{width:100%;border:0;border-radius:6px;background:var(--or);color:#fff;font-weight:600;font-size:14px;padding:12px;cursor:pointer;margin-top:12px}
.btn.gr{background:#1F9D55;color:#fff}.btn.g{background:none;border:1px solid var(--or);color:var(--or)}.btn.d{background:none;border:1px solid var(--no);color:var(--no)}
.nt{color:var(--mu);font-size:11.5px;text-align:center;margin:4px 12px 12px}
.fl{display:block;font-size:12px;color:var(--mu);margin-top:10px}.fm{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:12px;font-size:16px;margin-top:4px;font-family:inherit}.err{color:var(--no);font-size:12.5px;margin-top:8px;min-height:16px}
.dt{position:relative;margin-top:4px}.dt .fm{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1;cursor:pointer}.dv{display:block;min-height:46px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:12px;font-size:16px;font-family:inherit}
.nm{background:none;border:0;color:var(--tx);font:inherit;text-align:left;padding:0;cursor:pointer;display:block}.wa{display:inline-block;color:var(--or);font-size:11.5px;margin-top:2px;padding:4px 0;text-decoration:underline}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.tg button{border:1px solid var(--ln);background:none;color:var(--tx);border-radius:8px;padding:10px 0;font-size:13px;cursor:pointer}.tg button.on{background:var(--or);border-color:var(--or);color:#fff}
.bx{margin-top:12px;border:1px dashed var(--or);border-radius:8px;padding:2px 12px;background:var(--bg)}.big2{font-size:16px;color:var(--or)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90%;text-align:center}
.lgn{min-height:100vh;background:linear-gradient(160deg,var(--or),var(--or2));display:flex;flex-direction:column;justify-content:center;padding:24px 16px;margin-bottom:-76px}
.lgh{text-align:center;color:#fff;margin-bottom:22px}.lgh svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}.lgh h1{font-size:22px;margin-top:12px}.lgh p{font-size:13px;opacity:.92;margin-top:4px}
.lc{background:var(--card);border-radius:14px;padding:18px 16px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.lk{background:none;border:0;color:var(--mu);font-size:12.5px;margin-top:14px;width:100%;cursor:pointer;text-decoration:underline}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}.sw:last-child{border-bottom:0}
.sw .row{padding-right:14px;border-bottom:0;background:var(--card);position:relative;touch-action:pan-y;transition:transform .2s;user-select:none;-webkit-user-select:none}
.sw .sd{position:absolute;right:0;top:0;bottom:0;width:64px;background:var(--no);color:#fff;border:0;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sw .sd svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw .sd{padding:0;gap:3px}
.pw{position:relative}.pw .fm{padding-right:44px}.eye{position:absolute;right:0;top:4px;bottom:0;width:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--mu);cursor:pointer;padding:0}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

</style>
<style id="pcs" media="(min-width:900px)">
/* ===== Mode PC (layar lebar >= 900px, atau dipaksa lewat tab Admin) ===== */
body{display:block}
#app{width:auto;max-width:none;min-height:100vh;padding-bottom:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;row-gap:16px;align-content:start}
#app>*{min-width:0}
#app:has(nav){margin-left:220px;padding-inline:max(24px,calc((100% - 1000px)/2))}
#app:not(:has(nav)){display:block;width:100%;padding:0}
#app>.hd,#app>.wal,#app>.nt{grid-column:1/-1}
#app>.sec:last-of-type:nth-of-type(odd){grid-column:1/-1}
#app>.hd{margin-top:24px;border-radius:16px;padding:28px 28px 76px}
#app>.hd h1{font-size:22px}#app>.hd p{font-size:13.5px}
#app>.wal{margin:-52px 20px 0;padding:20px 24px}
#app>.sec{margin:0;padding:18px 20px}
#app>.nt{margin:0}
.wal b.big{font-size:30px}
.grid{max-width:560px}
.bars{height:210px}.bp{height:176px}
#lst{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px}
#lst>p{grid-column:1/-1}
.row,button.row,.st,.chips button,.btn,.lk,.nm{transition:background .15s,opacity .15s}
button.row:hover,.row:hover{background:rgba(30,111,217,.06)}
.btn:hover{opacity:.9}.st:hover{opacity:.75}
.sec .btn,.wal .btn{max-width:420px}
nav{top:0;bottom:0;left:0;transform:none;width:220px;max-width:none;flex-direction:column;justify-content:flex-start;gap:4px;padding:24px 12px;background:linear-gradient(180deg,var(--or),var(--or2));box-shadow:2px 0 12px rgba(0,0,0,.12);z-index:8}
nav::before{content:"Koperasi Kosfa";color:#fff;font-size:17px;font-weight:700;padding:4px 14px 20px}
nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:14px;border-radius:10px;opacity:.85;text-align:left}
nav button i{width:24px;height:24px;border-radius:0;background:none}
nav button:hover{background:rgba(255,255,255,.14);opacity:1}
nav button.on{background:rgba(255,255,255,.24);opacity:1}
nav button.on i{background:none}
.mk{align-items:center;padding:24px}
.sh{max-width:520px;border-radius:16px;max-height:88vh;padding:22px 22px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.lgn{margin-bottom:0;align-items:center}
.lgn .lgh{width:100%}.lgn .lc{width:100%;max-width:420px}
.toast{top:20px}
/* Daftar transaksi: tombol hapus di kanan, angka bergeser mengikuti ikon (tidak tumpang tindih) */
.sw{display:flex;align-items:stretch}
.sw .sd{position:static;order:2;flex:none;width:64px}
.sw .row{order:1;flex:1;min-width:0;transform:none!important;transition:background .15s}
.sw .row:hover{background:var(--card)}
</style>
<style id="pcs2" media="(min-width:1500px)">
#app:has(nav){padding-inline:max(24px,calc((100% - 1100px)/2))}
</style>

<body>
<div id="app"></div>
<script>
var KEY='kosfa-db-v3',AK='kosfa-auth',SK='kosfa-sess2',TK='kosfa-tab';
var BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var TEN=[[7,"1 minggu"],[14,"2 minggu"],[30,"1 bulan"],[60,"2 bulan"],[90,"3 bulan"]];
var SUMBER=["Angsuran debitur","Setoran modal","Pendapatan lain","Lainnya"];
var DB={D:[],K:[],T:[]},A=null,AUTH=false,S={tab:"home",f:"Semua",q:""};
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lw(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function save(){if(!lw(KEY,JSON.stringify(DB)))toast('Data gagal disimpan. Penyimpanan browser penuh atau diblokir.')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return(n<10?'0':'')+n}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return isoOf(new Date())}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fd(s){if(!s)return '-';var p=s.split('-');return p[2]+'-'+BLN[+p[1]-1]+'-'+p[0]}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return isoOf(d)}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function rp(n){return(n<0?'−':'')+'Rp'+fmt(Math.abs(n))}
function jt(n){return(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt'}
function tlb(n){return n>=30&&n%30===0?n/30+' bulan':n%7===0?n/7+' minggu':n+' hari'}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ini(n){return n.trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
function sum(a,k){return a.reduce(function(s,x){return s+x[k]},0)}
function val(i){return document.getElementById(i).value}
function num(i){return parseInt(val(i).replace(/\D/g,''),10)||0}
function pc(i){var x=parseFloat(val(i).replace(',','.'));return isNaN(x)?0:x}
function emsg(m){var e=document.getElementById('err');if(e)e.textContent=m;return 0}
function toast(m){var e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},3500)}
function fmtI(el){var c=el.value.replace(/\D/g,'');el.value=c?fmt(+c):'';tot()}
var MONEY='inputmode="numeric" autocomplete="off" oninput="fmtI(this)"';
function F(id,l,v,a){return '<label class="fl" for="'+id+'">'+l+'</label><input class="fm" id="'+id+'" value="'+esc(v)+'" '+(a||'')+'>'}
function SEL(id,l,o,v,a){return '<label class="fl" for="'+id+'">'+l+'</label><select class="fm" id="'+id+'" '+(a||'')+'>'+o.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(x[0])===String(v)?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')+'</select>'}
function DT(id,l,v,oc){return '<label class="fl" for="'+id+'">'+l+'</label><div class="dt"><input class="fm" id="'+id+'" type="date" value="'+esc(v)+'" onchange="dtc(this);'+(oc||'')+'" oninput="dtc(this);'+(oc||'')+'"><span class="dv" id="'+id+'v">'+(v?fd(v):'Pilih tanggal')+'</span></div>'}
function dtc(el){document.getElementById(el.id+'v').textContent=el.value?fd(el.value):'Pilih tanggal'}
function sheet(h){cls();document.body.insertAdjacentHTML('beforeend','<div class="mk" onclick="if(event.target===this)cls()"><div class="sh">'+h+'</div></div>')}
function cls(){document.querySelectorAll('.mk').forEach(function(m){m.remove()})}

/* ===== Data: muat dan migrasi dari versi lama ===== */
function migrate(){try{var b=JSON.parse(ls('kosfa-baru-v2')||'[]'),m=JSON.parse(ls('kosfa-masuk-v2')||'[]');
b.forEach(function(x){DB.D.push({id:uid(),n:x[0],u:x[1],pk:x[2],bg:x[3],tn:x[3]*30,cair:x[7]})});
m.forEach(function(x){DB.T.push({id:uid(),src:x[0],note:x[1],amt:x[2],date:x[3]})});
if(b.length||m.length)save()}catch(e){}}
try{var r=ls(KEY);if(r)DB=JSON.parse(r);else migrate()}catch(e){}
DB.D=DB.D||[];DB.K=DB.K||[];DB.T=DB.T||[];

/* ===== Hitungan ===== */
function calc(d){var tot=Math.round(d.pk*(1+d.bg/100)),paid=0;DB.T.forEach(function(t){if(t.did===d.id)paid+=t.amt});
var due=d.jt||addDays(d.cair,d.tn),sisa=Math.max(0,tot-paid),td=today(),late=sisa>0&&td>due?Math.round((pd(td)-pd(due))/864e5):0;
return Object.assign({},d,{tot:tot,paid:paid,sisa:sisa,due:due,late:late,st:sisa<=0?'Lunas':late>0?'Telat':'Lancar'})}
function L(){return DB.D.map(calc)}
function kst(k){return k.sisa<=0?'Lunas':(k.jt&&k.jt<today()?'Telat':'Lancar')}
function flow(){var n=new Date(),M=[],IN=[0,0,0,0,0,0],OUT=[0,0,0,0,0,0];
for(var i=5;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth()-i,1);M.push([d.getFullYear(),d.getMonth()])}
function ix(s){var p=s.split('-');for(var i=0;i<6;i++)if(M[i][0]===+p[0]&&M[i][1]===+p[1]-1)return i;return -1}
DB.T.forEach(function(t){var i=ix(t.date);if(i>=0)IN[i]+=t.amt});DB.D.forEach(function(d){var i=ix(d.cair);if(i>=0)OUT[i]+=d.pk});
return{M:M,IN:IN,OUT:OUT}}

/* ===== Tampilan ===== */
function go(t,f){S.tab=t;if(f)S.f=f;lw(TK,t);draw()}
function item(d){return '<div class="row"><div class="who"><span class="av">'+esc(ini(d.n))+'</span><div><button type="button" class="nm" onclick="menu(\''+d.id+'\')"><b>'+esc(d.n)+'</b></button><small>'+esc(d.u)+' · '+rp(d.pk)+'</small>'+(d.hp?'<a class="wa" href="https://wa.me/'+waNum(d.hp)+'" target="_blank" rel="noopener">'+esc(d.hp)+'</a>':'')+'</div></div><div class="rt" style="cursor:pointer" onclick="menu(\''+d.id+'\')"><span class="tag '+d.st+'">'+d.st+'</span><small style="display:block;color:var(--mu);font-size:11.5px;margin-top:4px">'+(d.st==='Telat'?'Telat '+d.late+' hari · ':'')+'Sisa '+rp(d.sisa)+'</small></div></div>'}
function home(){var l=L(),ak=l.filter(function(d){return d.st!=='Lunas'}),tl=l.filter(function(d){return d.st==='Telat'}),F2=flow(),mx=Math.max.apply(null,F2.IN.concat(F2.OUT))||1;
function cnt(s){return l.filter(function(d){return d.st===s}).length}
var bars=F2.M.map(function(m,i){return '<div class="bc"><div class="bp"><i class="m" style="height:'+F2.IN[i]/mx*100+'%"></i><i class="k" style="height:'+F2.OUT[i]/mx*100+'%"></i></div><small>'+BLN[m[1]]+'</small></div>'}).join('');

function hapusS(id,k){if(!canAdmin())return toast('Hanya admin yang bisa mengubah data ini.');

DB.D=DB.D.filter(function(x){return x.id!==id});DB.T=DB.T.filter(function(t){return t.did!==id});save();draw();return toast('Pencairan dan debitur dihapus. Data kas diperbarui')}
var t=DB.T.filter(function(x){return x.id===id})[0];if(!t)return;
if(!confirm('Hapus transaksi ini? Kas masuk, kas bersih, dan sisa tagihan debitur akan dihitung ulang.'))return swc();
DB.T=DB.T.filter(function(x){return x.id!==id});save();draw();toast('Transaksi dihapus. Data kas diperbarui')}
function swc(except){document.querySelectorAll('.sw .row').forEach(function(r){if(r!==except){r.style.transform='';r.dataset.o=''}})}
(function(){var W=64,sx=0,sy=0,cur=0,el=null,mv=false,lock=false;
document.addEventListener('pointerdown',function(e){var r=e.target.closest&&e.target.closest('.sw .row');
if(!r){if(!(e.target.closest&&e.target.closest('.sd')))swc();return}el=r;sx=e.clientX;sy=e.clientY;cur=r.dataset.o==='1'?-W:0;mv=false;lock=false;swc(r)});
document.addEventListener('pointermove',function(e){if(!el)return;var dx=e.clientX-sx,dy=e.clientY-sy;
if(!lock){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){el=null;return}if(Math.abs(dx)>8)lock=true;else return}
mv=true;el.style.transition='none';el.style.transform='translateX('+Math.max(-W,Math.min(0,cur+dx))+'px)'});
function end(){if(!el)return;var r=el;el=null;r.style.transition='';
if(!mv)return;var m=new DOMMatrixReadOnly(getComputedStyle(r).transform).m41,o=m<-W/2;
r.style.transform=o?'translateX('+-W+'px)':'';r.dataset.o=o?'1':''}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
document.addEventListener('click',function(e){var r=e.target.closest&&e.target.closest('.sw .row');
if(r&&(mv||r.dataset.o==='1')){e.stopPropagation();e.preventDefault();if(!mv){r.style.transform='';r.dataset.o=''}mv=false}},true)})();
</script>
