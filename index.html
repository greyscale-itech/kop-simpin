<style>
:root{--or:#1E6FD9;--or2:#1FB58A;--bg:#F5F5F5;--card:#fff;--tx:#222;--mu:#757575;--ln:#EAEAEA;--ok:#1B9A7A;--no:#D0011B;--wn:#C77700;--kb:#B8C4D6;--sN-bg:#F1EFE8;--sN-tx:#444441;--sB-bg:#E6F1FB;--sB-tx:#0C447C;--sG-bg:#EAF3DE;--sG-tx:#27500A;--sC-bg:#FAECE7;--sC-tx:#4A1B0C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1E1E1E;--tx:#F2F2F2;--mu:#A0A0A0;--ln:#2E2E2E;--ok:#3CCBA5;--no:#FF6B6B;--wn:#FFB84D;--kb:#5B6778;--sN-bg:#2C2C2A;--sN-tx:#D3D1C7;--sB-bg:#0C447C;--sB-tx:#B5D4F4;--sG-bg:#27500A;--sG-tx:#C0DD97;--sC-bg:#4A1B0C;--sC-tx:#F5C4B3}}
:root[data-theme="dark"]{--bg:#121212;--card:#1E1E1E;--tx:#F2F2F2;--mu:#A0A0A0;--ln:#2E2E2E;--ok:#3CCBA5;--no:#FF6B6B;--wn:#FFB84D;--kb:#5B6778;--sN-bg:#2C2C2A;--sN-tx:#D3D1C7;--sB-bg:#0C447C;--sB-tx:#B5D4F4;--sG-bg:#27500A;--sG-tx:#C0DD97;--sC-bg:#4A1B0C;--sC-tx:#F5C4B3}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;font-size:14px;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;padding-bottom:76px}
.hd{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;padding:18px 16px 64px}
.hd h1{font-size:17px;font-weight:700}.hd p{font-size:12px;opacity:.9;margin-top:2px}
.cpb{background:none;border:0;padding:4px;margin-left:6px;cursor:pointer;color:var(--or);display:inline-grid;place-items:center;vertical-align:middle;min-width:32px;min-height:32px;border-radius:6px}.cpb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.cpb:active{background:rgba(0,0,0,.1)}
.hd.ov+.sec{margin-top:-48px;position:relative;z-index:1;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.wal{margin:-48px 12px 0;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:14px}
.wal small{color:var(--mu);font-size:12px}.wal b.big{font-size:24px;display:block;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.st{background:none;border:0;color:var(--tx);cursor:pointer;text-align:center;font-size:11.5px;padding:4px 0}
.walrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px}
.walrow .accinfo{min-width:180px}
.walrow.dvh{justify-content:flex-start;flex-wrap:wrap;gap:14px 22px;overflow:hidden}
.dvh .dvc{flex:1 1 100%;min-width:0;margin:0;background:#2F3445;color:#D9DCE8;border-radius:10px;padding:12px 14px 10px}
.dvt{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 14px;margin-bottom:8px}
.dvt b{font-size:12.5px;font-weight:600;color:#fff}
.dvl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#B7BCCF}
.dvl span{display:inline-flex;align-items:center;gap:5px}
.dvl i{width:14px;height:6px;border-radius:3px;display:block}
.dvp svg{width:100%;height:160px;display:block}
.dvx{position:relative;height:16px;margin-top:6px}
.dvx span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:#9AA0B4;white-space:nowrap}
.akb{display:flex;align-items:center;gap:10px}.akb .btn{width:auto;min-width:0;margin:0;padding:6px 12px;font-size:12.5px}
.akk{display:flex;justify-content:center;margin-top:12px}.akk .btn{width:auto;min-width:170px;margin:0}
.capr{display:flex;justify-content:flex-end}.capr .btn{width:auto;min-width:170px}
.walrow .grid.g2{margin:0;padding:0;border-top:0;display:flex;gap:28px;width:auto}
.walrow .grid.g2 .st{text-align:left;padding:0}

/* full=true: ambil data server lalu gabungkan. Tanpa full: hanya kirim perubahan lokal. */
async function syncNow(full,man){if(!AUTH||!A||!canAdmin())return;
if(SY.on){SY.q=1;if(full)SY.qf=1;return}
SY.on=1;var bad=0,code=0,chg=false;
try{var srv=full?await sFetch():SYN;
if(full&&!Object.keys(srv).length&&Object.keys(SYN).length)SYN={};
var loc=sRecs(),ids={},ops=[],res=[];
[loc,srv,SYN].forEach(function(m){Object.keys(m).forEach(function(i){ids[i]=1})});
Object.keys(ids).forEach(function(id){var l=loc[id],s=srv[id],o=SYN[id],t=null,op=null;
if(s&&s.k==='X'){delete SYN[id];return}
if(l&&s){if(o&&l.j!==o.j){t=l;if(s.j!==l.j)op=['u',id,l]}else t=s}
else if(l){if(!o||l.j!==o.j){t=l;op=['c',id,l]}}
else if(s){if(o&&s.j===o.j)op=['x',id];else t=s}
else if(o)op=['x',id];
if(t){res.push(t);if(s&&t.j===s.j)SYN[id]=s}else if(!op)delete SYN[id];
if(op)ops.push(op)});
if(full){var nd={D:[],K:[],T:[],O:[]};['D','K','T','O'].forEach(function(k){DB[k].forEach(function(x){if(!(x&&sOk(x.id)))nd[k].push(x)})});
res.forEach(function(t){nd[t.k].push(JSON.parse(t.j))});var ns=JSON.stringify(nd);
if(ns!==JSON.stringify({D:DB.D,K:DB.K,T:DB.T,O:DB.O})){DB=nd;lw(KEY,ns);chg=true}}
for(var i=0;i<ops.length;i++){var o2=ops[i],r2=await sOp(o2);
if(r2===true){if(o2[0]==='x')delete SYN[o2[1]];else SYN[o2[1]]=o2[2]}else{bad++;code=r2}}
SY.msg=bad?(code===404||code===401||code===403?sMsg(code)+' (kode '+code+')':'Sebagian perubahan belum terkirim (kode '+code+'). Kolom body di Appwrite mungkin terlalu kecil.'):'Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'. '+(full?'Baris di server: '+Object.keys(srv).length+'. ':'')+'Dikirim: '+(ops.length-bad)+(chg?'. Data di perangkat ini diperbarui dari server.':'.');
if(!SY.mute&&!bad&&(ops.length||man))cling();
if(chg&&!document.querySelector('.mk'))draw()}
catch(e){SY.msg=sMsg(e)}
lw(SYK,JSON.stringify(SYN));SY.on=0;
if(man){toast(SY.msg);if(!document.querySelector('.mk'))draw()}
if(SY.q){var f=SY.qf;SY.q=SY.qf=0;syncNow(f)}}
setInterval(function(){if(!document.hidden)syncNow(1)},60000);
window.addEventListener('online',function(){syncNow(1)});

/* ===== Session timeout: keluar otomatis setelah 10 menit tidak aktif ===== */
var TO=600000,AKT='kosfa-act',ACT=+ls(AKT)||0,ACTW=0;
function actTouch(){if(!AUTH)return;var n=Date.now();ACT=n;if(n-ACTW>5000){ACTW=n;lw(AKT,String(n))}}
function sessExp(){return Date.now()-Math.max(+ls(AKT)||0,ACT)>TO}
function sessCek(){if(!AUTH||!sessExp())return;cls();var f=document.querySelector('.upfl');if(f)f.remove();logout();toast('Sesi berakhir karena tidak aktif 10 menit. Silakan masuk lagi.')}
['pointerdown','keydown','touchstart','scroll','wheel','mousemove'].forEach(function(ev){document.addEventListener(ev,actTouch,{passive:true,capture:true})});
setInterval(sessCek,10000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sessCek()});
window.addEventListener('focus',sessCek);
var ts=ls(TK);if(ts&&['home','deb','cash','kre','dev'].indexOf(ts)>-1)S.tab=ts;
try{A=JSON.parse(ls(AK))}catch(e){}
AUTH=!!A&&ls(SK)==='1';var SEXP=false;if(AUTH&&Date.now()-(+ls(AKT)||0)>TO){AUTH=false;SEXP=true;try{localStorage.removeItem(SK)}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
draw();if(SEXP)toast('Sesi berakhir karena tidak aktif 10 menit. Silakan masuk lagi.');
cekNotif();setInterval(function(){cekNotif()},30000);document.addEventListener('visibilitychange',function(){cekNotif();if(!document.hidden&&AUTH)fetchRole()});if(AUTH){fetchRole();hbBeat()}

/* ===== Geser untuk hapus (Cash flow) ===== */
function hapusS(id,k){if(!canAdmin())return toast('Hanya admin yang bisa mengubah data ini.');
if(k==='d'){var d=DB.D.filter(function(x){return x.id===id})[0];if(!d)return;
if(!confirm('Hapus pencairan ini? Debitur '+d.n+' beserta riwayat angsurannya ikut terhapus, dan seluruh data kas dihitung ulang. Tindakan ini tidak bisa dibatalkan.'))return swc();
DB.D=DB.D.filter(function(x){return x.id!==id});DB.T=DB.T.filter(function(t){return t.did!==id});save();draw();toast('Pencairan dan debitur dihapus. Data kas diperbarui');return rqPurge(d)}
if(k==='o'){var o=DB.O.filter(function(x){return x.id===id})[0];if(!o)return;
if(!confirm('Hapus dana keluar ini?'+(o.kid?' Sisa kewajiban kreditur dikembalikan,':'')+' kas dihitung ulang.'))return swc();
if(o.kid){var kk=DB.K.filter(function(x){return x.id===o.kid})[0];if(kk)kk.sisa=Math.min(kk.pl,kk.sisa+(o.red||0))}
DB.O=DB.O.filter(function(x){return x.id!==id});save();draw();return toast('Dana keluar dihapus. Data kas diperbarui')}
var t=DB.T.filter(function(x){return x.id===id})[0];if(!t)return;
if(!confirm(t.kid?'Hapus transaksi ini? Data kreditur yang terkait juga ikut terhapus, dan kas dihitung ulang.':'Hapus transaksi ini? Kas masuk, kas bersih, dan sisa tagihan debitur akan dihitung ulang.'))return swc();
if(t.kid)DB.K=DB.K.filter(function(k){return k.id!==t.kid});DB.T=DB.T.filter(function(x){return x.id!==id});save();draw();toast('Transaksi dihapus. Data kas diperbarui')}
function swc(except){document.querySelectorAll('.sw .row').forEach(function(r){if(r!==except){r.style.transform='';r.dataset.o=''}})}
(function(){var W=64,sx=0,sy=0,cur=0,el=null,mv=false,lock=false;
document.addEventListener('pointerdown',function(e){var r=e.target.closest&&e.target.closest('.sw .row');
if(!r){if(!(e.target.closest&&e.target.closest('.sd')))swc();return}el=r;sx=e.clientX;sy=e.clientY;cur=r.dataset.o==='1'?-W:0;mv=false;lock=false;swc(r)});
document.addEventListener('pointermove',function(e){if(!el)return;var dx=e.clientX-sx,dy=e.clientY-sy;
if(!lock){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){el=null;return}if(Math.abs(dx)>8)lock=true;else return}
mv=true;el.style.transition='none';el.style.transform='translateX('+Math.max(-W,Math.min(0,cur+dx))+'px)'});
function end(){if(!el)return;var r=el;el=null;r.style.transition='';
if(!mv)return;var m=new DOMMatrixReadOnly(getComputedStyle(r).transform).m41,o=m<-W/2;
r.style.transform=o?'translateX('+-W+'px)':'';r.dataset.o=o?'1':''}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
document.addEventListener('click',function(e){var r=e.target.closest&&e.target.closest('.sw .row');
if(r&&(mv||r.dataset.o==='1')){e.stopPropagation();e.preventDefault();if(!mv){r.style.transform='';r.dataset.o=''}mv=false}},true)})();

/* ===== Revisi 4: notifikasi pengajuan baru untuk admin dan developer ===== */
var RSK='kosfa-rqseen';
function pendingN(){return (RQ.rows||[]).filter(function(x){return x.status==='menunggu'}).length}
function mlbBtn(){var n=pendingN();return '<button type="button" class="shr mlb" aria-label="Pengajuan pinjaman" onclick="rqOpen()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="mlbn" id="mlbn"'+(n?'':' hidden')+'>'+(n>99?'99+':n)+'</span></button>'}
function mlbUpd(){var b=document.getElementById('mlbn'),n=pendingN();if(!b)return;b.textContent=n>99?'99+':String(n);b.hidden=!n}
async function rqPoll(){if(!AUTH||!canAdmin()||RQ.busy)return;RQ.quiet=1;try{await rqLoad()}finally{RQ.quiet=0}rqAuto();mlbUpd();rqPop()}
function rqPop(){if(!AUTH||!canAdmin()||!RQ.rows||RQ.err)return;var seen;try{seen=JSON.parse(ls(RSK)||'[]')}catch(e){seen=[]}
var P=RQ.rows.filter(function(x){return x.status==='menunggu'}),nw=P.filter(function(x){return seen.indexOf(x.$id)<0});if(!nw.length)return;
var ids=JSON.stringify(P.map(function(x){return x.$id}));
if(document.hidden){if(window.Notification&&Notification.permission==='granted'){try{new Notification('Simpinku: Anda memiliki '+nw.length+' pengajuan baru',{body:nw.slice(0,3).map(function(x){return x.nama}).join(', ')})}catch(e){}lw(RSK,ids)}return}
if(document.querySelector('.mk'))return;lw(RSK,ids);
sheet('<h3>Anda memiliki '+nw.length+' pengajuan baru</h3>'+nw.slice(0,3).map(function(x){return '<div class="row"><span>'+esc(x.nama)+'</span><b>'+rp(x.jumlah)+'</b></div>'}).join('')+(nw.length>3?'<p style="color:var(--mu);font-size:12.5px">dan '+(nw.length-3)+' lainnya</p>':'')+'<button class="btn" onclick="cls();rqOpen()">Lihat pengajuan</button><button class="btn g" onclick="cls()">Nanti</button>');try{cling()}catch(e){}}
setInterval(rqPoll,30000);
async function nasPoll(){if(!AUTH||!isNas()||RQ.busy||document.hidden)return;var b=JSON.stringify(RQ.rows);RQ.quiet=1;try{await rqLoad()}finally{RQ.quiet=0}if(JSON.stringify(RQ.rows)!==b&&!document.querySelector('.mk'))draw()}
setInterval(nasPoll,30000);document.addEventListener('visibilitychange',function(){if(!document.hidden)nasPoll()});
